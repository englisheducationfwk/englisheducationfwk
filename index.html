<script>
'use strict';
var D=JSON.parse(document.getElementById('d').textContent);
var A=D.articles;
var LVC={'Beginner':'#5ac8fa','Elementary':'#3ddc97','Pre-Intermediate':'#9be15d',
         'Intermediate':'#ffd166','Upper-Intermediate':'#ff9f43','Advanced':'#ff7a8a'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fsz(b){if(b>=1048576)return (b/1048576).toFixed(1)+' МБ';return Math.max(1,Math.round(b/1024))+' КБ'}
function fdt(d){if(!d)return '·';var p=d.split('-');return p.length>=3?(+p[2])+'.'+p[1]+'.'+p[0]:p[0]}
var st={cat:'all',years:new Set(),q:'',page:1};
var PAGE=30;

function yearOf(a){return a.y||'—'}
function match(a){
  if(st.cat!=='all'&&a.sec!==st.cat)return false;
  if(st.years.size&&!st.years.has(yearOf(a)))return false;
  if(st.q){var t=(a.title+' '+a.files.map(function(f){return f.n}).join(' ')).toLowerCase();
    if(t.indexOf(st.q.toLowerCase())<0)return false}
  return true;
}
function card(a){
  var lv=a.lv.map(function(l){return '<span class="pl" style="color:'+(LVC[l]||'#9be15d')+';border-color:'+(LVC[l]||'#9be15d')+'44">'+esc(l)+'</span>'}).join('');
  var fl=a.files.map(function(f){
    return '<a class="fr" href="'+f.p+'" target="_blank" rel="noopener">'+
      '<span class="fic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>'+
      '<span class="fn">'+esc(f.n)+'</span><span class="fsz">'+fsz(f.sz)+'</span>'+
      '<span class="fgo"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span></a>'
  }).join('<div class="fsep"></div>');
  return '<article class="card" data-id="'+esc(a.id)+'">'+
    '<button class="hdbtn" type="button">'+
      '<span class="meta"><span>'+fdt(a.date)+'</span><span>·</span><span class="pcount">'+a.files.length+' файл'+(a.files.length===1?'':'ов')+'</span>'+(a.sec==='Business News Lessons'?'<span>·</span><span>Business</span>':'')+'</span>'+
      '<span class="ttlrow"><span class="ttl">'+esc(a.title)+'</span>'+
      '<span class="chev"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></span>'+
      (lv?'<span class="lvl">'+lv+'</span>':'')+
    '</button>'+
    '<div class="body"><div class="bin">'+fl+'</div></div>'+
  '</article>';
}
function render(){
  var all=A.filter(match);
  var pages=Math.max(1,Math.ceil(all.length/PAGE));
  if(st.page>pages)st.page=pages;
  if(st.page<1)st.page=1;
  var list=all.slice((st.page-1)*PAGE,st.page*PAGE);
  var html='',i,cur='',c;
  if(!all.length){html='<div class="empty"><b>🎯</b>Ничего не нашлось<br>попробуй другой запрос или сними фильтры</div>'}
  else{for(i=0;i<list.length;i++){c=yearOf(list[i]);
    if(c!==cur){cur=c;html+='<div class="yr">'+esc(c)+' <i>· '+all.filter(function(x){return yearOf(x)===c}).length+'</i></div>'}
    html+=card(list[i])}}
  document.getElementById('list').innerHTML=html;
  document.getElementById('sub').textContent=all.length+' уроков · '+
    all.reduce(function(s,a){return s+a.files.length},0)+' файлов · '+fsz(all.reduce(function(s,a){return s+a.files.reduce(function(t,f){return t+f.sz},0)},0));
  var from=all.length?(st.page-1)*PAGE+1:0,to=Math.min(all.length,st.page*PAGE);
  var al='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
  var ar='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
  document.getElementById('pagerwrap').innerHTML=all.length?('<div class="pager">'+
    '<button class="pgbtn" id="pgp"'+(st.page<=1?' disabled':'')+'>'+al+'Назад</button>'+
    '<div class="pginfo">Страница <b>'+st.page+'</b> из '+pages+'<br>уроки '+from+'–'+to+' из '+all.length+'</div>'+
    '<button class="pgbtn" id="pgn"'+(st.page>=pages?' disabled':'')+'>Вперёд'+ar+'</button>'+
    '</div>'):'';
}
function chips(){
  var yc={},y;
  A.forEach(function(a){var k=yearOf(a);yc[k]=(yc[k]||0)+1});
  var ys=Object.keys(yc).sort().reverse();
  document.getElementById('years').innerHTML=
    '<span class="chip'+(st.years.size?'':' on')+'" data-year="*">Все годы</span>'+
    ys.map(function(y){return '<span class="chip'+(st.years.has(y)?' on':'')+'" data-year="'+esc(y)+'">'+esc(y)+' · '+yc[y]+'</span>'}).join('');
}
document.getElementById('seg').addEventListener('click',function(e){
  var b=e.target.closest('[data-cat]');if(!b)return;
  st.cat=b.dataset.cat;st.page=1;
  document.querySelectorAll('#seg button').forEach(function(x){x.classList.toggle('on',x===b)});
  render()});
document.getElementById('years').addEventListener('click',function(e){
  var c=e.target.closest('[data-year]');if(!c)return;
  if(c.dataset.year==='*')st.years.clear();
  else{var y=c.dataset.year;st.years.has(y)?st.years.delete(y):st.years.add(y)}
  st.page=1;
  chips();render()});
document.getElementById('q').addEventListener('input',function(e){
  st.q=e.target.value.trim();st.page=1;
  document.getElementById('searchbox').classList.toggle('has',!!st.q);
  render()});
document.getElementById('qc').addEventListener('click',function(){
  document.getElementById('q').value='';st.q='';
  document.getElementById('searchbox').classList.remove('has');render()});
document.getElementById('list').addEventListener('click',function(e){
  var b=e.target.closest('.hdbtn');if(!b)return;
  var card=b.closest('.card');card.classList.toggle('open')});
document.getElementById('totop').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
window.addEventListener('scroll',function(){
  document.getElementById('totop').classList.toggle('show',window.scrollY>700)},{passive:true});
document.getElementById('pagerwrap').addEventListener('click',function(e){
  if(e.target.closest('#pgp')){st.page--;render();window.scrollTo({top:0,behavior:'smooth'})}
  else if(e.target.closest('#pgn')){st.page++;render();window.scrollTo({top:0,behavior:'smooth'})}});
var TH=document.getElementById('thm');
var SUN='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON='<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  document.getElementById('tc').setAttribute('content',t==='light'?'#f6f5f1':'#07080d');
  TH.innerHTML=(t==='light')?MOON:SUN;
  try{localStorage.setItem('oe_theme',t)}catch(e){}
}
TH.addEventListener('click',function(){
  applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light')});
applyTheme(document.documentElement.dataset.theme||'light');
document.getElementById('foot').innerHTML='Материалы onestopenglish.com (Macmillan Education), собраны из веб-архива.<br>'+
  'Скачано уроков: <b style="color:var(--tx2)">'+D.stats.arts+'</b> · файлов: <b style="color:var(--tx2)">'+D.stats.files_ok+'</b> ('+fsz(D.stats.bytes)+')<br>'+
  'Обновлено: '+esc(D.built)+'<br><br>'+
  'Совет: открой эту страницу в Safari и добавь на экран «Домой» — будет как приложение.';
chips();render();
</script>
